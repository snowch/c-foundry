<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foundry Linux terminal</title><link rel="stylesheet" href="vendor/xterm.css"><style>html,body{margin:0;background:#101d1b;color:#e0ece7;font:16px system-ui}body{padding:12px}#terminal{height:440px;width:100%}p{margin:0 0 10px}label{display:block;margin:14px 0}button,input{font:inherit}button{padding:8px 16px}#status{min-height:24px}</style><script type="module" src="terminal.mjs"></script></head><body><p id="status" role="status">Preparing Linux…</p><button id="retry" hidden>Retry startup</button><div id="terminal" aria-label="Linux console"></div><label>Upload files to Linux <input id="upload" type="file" multiple></label><p>Use <code>export_file /path/to/file</code> in Linux to download a file. Guest files are temporary; export a work archive before stopping or reloading.</p></body></html>
