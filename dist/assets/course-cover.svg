<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" fill="none">
  <title>Write C, understand memory, build TinyDB</title>
  <desc>A C source card changes an integer through a pointer. A memory cell holds 42. A separate TinyDB table represents the database learners build later in the course.</desc>
  <ellipse cx="257" cy="178" rx="207" ry="141" fill="#edf1e6"/>
  <path d="M59 194c1 40 21 65 51 68M361 212c23-17 34-38 34-64" stroke="#b3c2a7" stroke-width="2" stroke-dasharray="5 7"/>
  <rect x="15" y="27" width="248" height="159" rx="12" fill="#d9e1d3"/>
  <rect x="9" y="20" width="248" height="159" rx="12" fill="#2b3b31"/>
  <path d="M9 61h248" stroke="#52664f"/>
  <circle cx="28" cy="41" r="5" fill="#e3a87c"/>
  <text x="44" y="48" fill="#dce7d5" font-family="ui-monospace,monospace" font-size="20">main.c</text>
  <g font-family="ui-monospace,monospace" font-size="24">
    <text x="27" y="94" fill="#f5f5e9">int x=10;</text>
    <text x="27" y="124" fill="#f5f5e9">int *p=&amp;x;</text>
    <text x="27" y="154" fill="#f3b185">*p=42;</text>
  </g>
  <rect x="284" y="87" width="180" height="117" rx="12" fill="#fffefa" stroke="#c2cfb9" stroke-width="2"/>
  <text x="301" y="119" fill="#52634f" font-family="system-ui,sans-serif" font-size="23">Memory</text>
  <text x="300" y="165" fill="#356044" font-family="ui-monospace,monospace" font-size="26">p</text>
  <path d="M324 157h29m-7-6 7 6-7 6" stroke="#628050" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="367" y="137" width="77" height="50" rx="7" fill="#f4dfc7"/>
  <text x="405" y="171" text-anchor="middle" fill="#8c3f27" font-family="ui-monospace,monospace" font-size="31">42</text>
  <text x="405" y="130" text-anchor="middle" fill="#52634f" font-family="ui-monospace,monospace" font-size="21">x</text>
  <rect x="109" y="219" width="307" height="102" rx="12" fill="#d9e1d3"/>
  <rect x="103" y="212" width="307" height="102" rx="12" fill="#fffefa" stroke="#bdcbb3" stroke-width="2"/>
  <path d="M103 253h307" stroke="#d7dfd1"/>
