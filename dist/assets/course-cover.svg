  <g fill="#52634f" font-family="ui-monospace,monospace" font-size="22">
    <text x="124" y="289">1</text><text x="187" y="289">Ada</text><text x="340" y="289">90</text>
  </g>
  <path d="M431 36v19m-9-10h18M64 274v15m-7-8h14" stroke="#bd8056" stroke-width="2" stroke-linecap="round"/>
</svg>
