name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Test interface and WebAssembly compiler
        run: npm test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [test-and-package, native]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build the Codespaces toolchain image
        run: docker build -f .devcontainer/Dockerfile -t c-foundry-native .
      - name: Test native foundations with GCC, Clang, and sanitizers
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspaces/c-foundry" -w /workspaces/c-foundry \
            c-foundry-native sh -c 'make check-debugging && make check-debugging CC=clang && make check-cli && make check-cli CC=clang NATIVE_BUILD=.build/cli-clang && make check-cli NATIVE_BUILD=.build/cli-sanitize CFLAGS="-std=c17 -Wall -Wextra -Wpedantic -Werror -g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined" && make check-native && make check-native-clang && make standards-matrix && make sanitize && make check-examples && make check-examples CC=clang && make check-examples SANITIZE=1 && make check-projects && make check-projects CC=clang && make check-projects SANITIZE=1 && make check-structures && make check-structures CC=clang && make check-structures SANITIZE=1 && make check-numeric && make check-numeric CC=clang && make check-numeric SANITIZE=1'
